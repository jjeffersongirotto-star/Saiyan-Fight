# Saiyan Fight NOVO (pasta novo/: Phaser 3 + TypeScript + Vite) — desde a v0.121 é o jogo publicado.
# Aqui só confere (testes + tsc estrito + build) em todo push/PR e guarda uma prévia para baixar. Quem publica é o
# pages.yml (site) e o android.yml (APK e Release "app-bundle" da setinha ATUALIZAR).
name: Jogo novo (Phaser)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  novo:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: novo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: novo/package-lock.json
      - run: npm ci
      - name: Testes (vitest)
        run: npm test
      - name: Build (tsc estrito + vite)
        run: npm run build
      - name: Prévia para baixar (abrir dist/index.html por um servidor local)
        uses: actions/upload-artifact@v4
        with:
          name: saiyan-fight-novo-previa
          path: novo/dist
          retention-days: 14
