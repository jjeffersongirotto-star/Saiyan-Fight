# Verificação "testes" (exigida pela proteção da branch main): roda os testes e o TypeScript estrito do jogo
# (pasta novo/) a cada push e pull request. Até a v0.127 rodava os testes do jogo antigo, apagado na v0.128.
name: Testes

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: novo/package-lock.json
      - name: Dependências
        working-directory: novo
        run: npm ci
      - name: TypeScript estrito
        working-directory: novo
        run: npx tsc --noEmit -p .
      - name: Testes (Vitest)
        working-directory: novo
        run: npx vitest run
