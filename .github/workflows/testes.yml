# Roda as verificações do jogo automaticamente a cada push e pull request.
# Sem dependências: só Node (mesmos comandos descritos em "Run and validation" no AGENTS.md).
name: Testes

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sintaxe dos arquivos .js
        run: for f in *.js tests/*.js; do node --check "$f"; done

      - name: Manifest válido
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8'))"

      - name: Lógica pura (game-logic-core)
        run: node --test tests/game-logic-core.test.js

      - name: Cenários (toque, menus, fases, ranking...)
        run: |
          status=0
          for t in tests/*.test.js; do
            [ "$t" = "tests/game-logic-core.test.js" ] && continue
            echo "== $t"
            node "$t" || status=1
          done
          exit $status
